# Прод: образ тянется из Harbor по тегу, собранному пайплайном.
# Разворачивается deploy-джобом (см. .gitea/workflows/pipeline.yml), который
# копирует на хост только этот файл — .env лежит на хосте постоянно и в
# репозитории не хранится.
name: max-bot-template

services:
  # Postgres хранит разделы меню, администраторов, статистику и журнал.
  # Наружу не публикуется.
  db:
    image: ${POSTGRES_IMAGE:-harbor.volganet.ru/dockerhub-proxy/postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Уникальное имя хоста: бот подключён ещё и к общей maxbots-network, и
    # короткое «db» могло бы совпасть с базой другого бота этой сети.
    networks:
      default:
        aliases:
          - max-bot-template-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 128

  bot:
    image: ${HARBOR_REGISTRY:-harbor.volganet.ru}/${HARBOR_PROJECT:-bothub-private}/${HARBOR_IMAGE:-max-bot-template}:${IMAGE_TAG:-latest}
    # build оставлен для аварийной локальной пересборки прод-конфигурации;
    # штатный путь — docker compose pull.
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        INSTALL_EXTRAS: ${INSTALL_EXTRAS:-}
        UID: ${UID:-10001}
        GID: ${GID:-10001}
    # .env лежит рядом с этим файлом на прод-хосте.
    env_file: .env
    environment:
      # Тег образа попадает внутрь процесса — команда /v показывает,
      # что развёрнуто на самом деле.
      BUILD_TAG: ${IMAGE_TAG:-}
      # POSTGRES_PASSWORD подставляется как есть — без символов @ : / ? #.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD}@max-bot-template-db:5432/${POSTGRES_DB:-bot}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Лимиты: бот не должен утащить хост за собой при утечке или флуде.
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0
    pids_limit: 256
    # Лимит дескрипторов: по умолчанию контейнер получает soft-лимит демона
    # (часто 1024). Всплеск входящих соединений вебхука упирается в него —
    # "OSError: [Errno 24] Too many open files" в socket.accept().
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # expose, а не ports: наружу бот публикуется реверс-прокси, напрямую порт
    # на хост не пробрасывается.
    expose:
      - "${PORT:-8081}"
    # default — сеть с db; без явного default имя базы не резолвится.
    networks:
      default:
      maxbots-network:
        aliases:
          - max-bot
    volumes:
      # Named volume: правами управляет Docker, рассинхрона с uid хоста нет.
      # Читать логи: docker compose exec bot cat /app/logs/bot.log
      - botlogs:/app/logs
    healthcheck:
      # Работает только при BOT_MODE=webhook (в polling порт не слушается).
      # Для polling healthcheck следует убрать, иначе контейнер будет
      # помечен unhealthy при полностью исправном боте.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${PORT:-8081}/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  botlogs:
  pgdata:

networks:
  maxbots-network:
    external: true
    name: maxbots-network
