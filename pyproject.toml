[project]
name = "max-bot-template"
version = "0.1.0"
description = "Шаблон чат-бота для мессенджера MAX (GitHub + Gitea CI/CD)"
# readme здесь намеренно не объявлен: .dockerignore исключает *.md из
# сборочного контекста, и hatchling падал бы на «Readme file does not exist».
# Бот — приложение, а не публикуемый на PyPI пакет; описание берётся из
# description выше.
requires-python = ">=3.12"
# Базовые зависимости — нужны любому боту на этом шаблоне.
# Всё, что нужно не всем (БД, метрики, почта), вынесено в optional-dependencies.
dependencies = [
    "maxapi[fastapi]>=1.2.0",
    "pydantic-settings>=2.14.0",
    "uvicorn>=0.20.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# Слой БД. Ставится только если боту нужно хранить состояние:
#   uv sync --extra db
db = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]
# Prometheus-метрики на отдельном порту (METRICS_ADDR).
metrics = [
    "prometheus-client>=0.20",
]

[project.scripts]
bot = "bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "respx>=0.21",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Автогенерируемые ревизии Alembic не линтуем и не форматируем.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E,F — pycodestyle/pyflakes; I — сортировка импортов (вместо isort);
# UP — pyupgrade; B — bugbear; ASYNC — проверки asyncio; RUF — правила ruff.
select = ["E", "F", "I", "UP", "B", "ASYNC", "W", "RUF"]
# E501 — длину строк держит форматтер, дублировать в линтере смысла нет.
# RUF001-003 — «похожие» кириллические символы в строках/комментариях:
#   проект русскоязычный, срабатывает на каждой строке.
# B008 — вызовы в дефолтах аргументов, часто нужны для DI (Depends(...)).
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
# В тестах допустимо синхронное чтение файлов для проверки результата.
"tests/**" = ["ASYNC230", "ASYNC240"]

[tool.ruff.lint.isort]
known-first-party = ["bot"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

# ---------------------------------------------------------------------------
# Закрытый контур: Nexus как PyPI-proxy.
# Индекс объявлен explicit — по умолчанию uv ходит в публичный PyPI, а на
# внутренний индекс переключается только явным --default-index (так делают
# пайплайны в .gitea/workflows/pipeline.yml и сборка в docker/Dockerfile).
# Снаружи контура секция безвредна: explicit-индекс не используется, пока его
# не потребовали явно.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "nexus"
url = "https://nexus.volganet.ru/repository/pypi-proxy/simple"
explicit = true
