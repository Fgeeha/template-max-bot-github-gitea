# Вариант для окружения с доступом к GitHub. Активируется через `make precommit`.
exclude: ^(\.gitea/|migrations/versions/)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      # Ловит .env, приватные ключи и прочее, что не должно попасть в историю.
      - id: detect-private-key
