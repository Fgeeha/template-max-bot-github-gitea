# Конфигурация Alembic (нужна только при использовании extra `db`).
# sqlalchemy.url здесь намеренно не задан: DSN берётся из настроек приложения,
# чтобы не держать креды в двух местах (см. migrations/env.py).

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# Имя файла ревизии: дата, время и slug из -m "описание".
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
