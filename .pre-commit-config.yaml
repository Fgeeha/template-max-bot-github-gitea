# Активная конфигурация. Перезаписывается командой `make precommit` одним из
# вариантов: .pre-commit-config.gitea.yaml (закрытый контур) либо
# .pre-commit-config.github.yaml (есть доступ в интернет).
exclude: ^(\.gitea/|migrations/versions/)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
